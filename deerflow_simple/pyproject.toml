[project]
name = "deerflow-simple"
version = "0.1.0"
description = "A minimal LangGraph + LangChain AgentMiddleware Q&A agent distilled from DeerFlow's core design"
requires-python = ">=3.12"
dependencies = [
    "langchain>=1.2.15",
    "langgraph>=1.2.9",
    "langchain-openai>=0.3.0",
    "langchain-mcp-adapters>=0.1.9",
    "langsmith>=0.3.0",
    "charset-normalizer>=3.0.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0"]
server = ["fastapi>=0.115.0", "uvicorn>=0.30.0"]
sqlite = ["langgraph-checkpoint-sqlite>=2.0.0", "aiosqlite>=0.19.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["deerflow_simple"]
